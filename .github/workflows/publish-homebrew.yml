name: Publish to Homebrew

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  publish:
    name: Publish to Homebrew
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Get version
        id: version
        run: |
          RAW="${{ github.event.workflow_run.head_branch }}"
          VERSION="${RAW#v}"
          if [ -z "${VERSION}" ]; then
            echo "ERROR: could not determine version from workflow_run event" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${VERSION}"

      - name: Download release binaries
        run: |
          VERSION=${{ steps.version.outputs.version }}
          wget -q "https://github.com/lancher-dev/lancher/releases/download/v${VERSION}/lancher-darwin-amd64"
          wget -q "https://github.com/lancher-dev/lancher/releases/download/v${VERSION}/lancher-darwin-arm64"
          wget -q "https://github.com/lancher-dev/lancher/releases/download/v${VERSION}/lancher-linux-amd64"
          wget -q "https://github.com/lancher-dev/lancher/releases/download/v${VERSION}/lancher-linux-arm64"

      - name: Calculate checksums
        id: checksums
        run: |
          echo "sha256_darwin_amd64=$(sha256sum lancher-darwin-amd64 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_darwin_arm64=$(sha256sum lancher-darwin-arm64 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_linux_amd64=$(sha256sum lancher-linux-amd64  | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "sha256_linux_arm64=$(sha256sum lancher-linux-arm64  | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: lancher-dev/homebrew-lancher
          token: ${{ secrets.HOMEBREW_REPO_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        env:
          VERSION:          ${{ steps.version.outputs.version }}
          SHA_DARWIN_AMD64: ${{ steps.checksums.outputs.sha256_darwin_amd64 }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.sha256_darwin_arm64 }}
          SHA_LINUX_AMD64:  ${{ steps.checksums.outputs.sha256_linux_amd64 }}
          SHA_LINUX_ARM64:  ${{ steps.checksums.outputs.sha256_linux_arm64 }}
        run: |
          envsubst < homebrew-tap/.github/templates/lancher.rb.tpl \
            > homebrew-tap/Formula/lancher.rb

      - name: Push Homebrew tap
        run: |
          cd homebrew-tap
          git config user.name  "lancher-bot"
          git config user.email "info@lucapattocchio.dev"
          git add Formula/lancher.rb
          git diff --cached --stat
          git commit \
            -m "chore: release v${{ steps.version.outputs.version }}" \
            || echo "Nothing to commit, skipping."
          git push
